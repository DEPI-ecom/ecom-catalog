name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: marketly
          POSTGRES_PASSWORD: marketly_dev_password
          POSTGRES_DB: catalog_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketly -d catalog_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketly:marketly_dev_password@localhost:5432/catalog_db?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed database
        run: npx prisma db seed
      - run: npm test
      - name: Build image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t ecom-catalog:ci .
