name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketly
          POSTGRES_PASSWORD: marketly_ci_password
          POSTGRES_DB: catalog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketly -d catalog_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketly:marketly_ci_password@localhost:5432/catalog_db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed the catalog (the tests expect the seed data)
        run: npm run db:seed
      - run: npm test
      - name: Build image
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          docker build -t "${NAME,,}:ci" .
